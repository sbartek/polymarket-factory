[project]
name = "polymarket-factory"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "requests",
    "ddgs",
    "anthropic",
    "py-clob-client-v2",
    "scikit-learn",
    "google-genai>=1.70.0",
    "fastapi",
    "uvicorn[standard]",
    "psycopg2-binary>=2.9.11",
    "glicko2>=2.1.0",
    "hltv-async-api>=0.8.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

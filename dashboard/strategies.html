<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PPLayouts Dashboard · Strategies</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div><p class="eyebrow">PPLayouts</p><h1 id="page-title">Strategies</h1><p id="snapshot-meta" class="muted">Loading snapshot…</p></div>
        <div class="status-cluster"><span id="snapshot-age" class="pill pill-neutral">…</span><span id="run-status-pill" class="pill pill-neutral">run: …</span></div>
      </header>
      <nav class="nav"><a href="./index.html" data-nav="overview">Overview</a><a href="./strategies.html" data-nav="strategies">Strategies</a><a href="./positions.html" data-nav="positions">Positions</a><a href="./runs.html" data-nav="runs">Runs</a><a href="./experiments.html" data-nav="experiments">Experiments</a></nav>
      <section id="alerts-section" class="panel hidden section-gap"><div class="panel-header"><h2>Alerts</h2></div><div id="alerts-list" class="stack"></div></section>
      <section class="panel">
        <div class="panel-header"><h2>All strategies</h2><span class="muted">Exposure, activity, and current classification</span></div>
        <div class="controls">
          <label>Status
            <select id="filter-status">
              <option value="all">All</option>
            </select>
          </label>
          <label>Search
            <input id="filter-search" type="text" placeholder="strategy name" />
          </label>
        </div>
        <div class="small-note" id="strategy-filter-note"></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Strategy</th><th>Status</th><th>Open exposure</th><th>Open positions</th><th>Recent signals</th><th>Exec checks</th><th>Avg EV @ $10</th><th>Avg EV @ $50</th><th>Avg max +EV size</th><th>30d PnL</th><th>All-time PnL</th></tr></thead>
            <tbody id="strategies-body"></tbody>
          </table>
        </div>
      </section>
    </div>
    <script src="./dashboard.js"></script>
    <script>
      Dashboard.renderNav('strategies');
      Dashboard.loadSnapshot().then((snapshot) => {
        Dashboard.renderChrome(snapshot, 'Strategies');
        Dashboard.renderAlerts(snapshot);
        const statusSelect = document.getElementById('filter-status');
        const searchInput = document.getElementById('filter-search');
        const note = document.getElementById('strategy-filter-note');
        const tbody = document.getElementById('strategies-body');
        Dashboard.uniqueValues(snapshot.strategies, 'status').forEach((value) => statusSelect.insertAdjacentHTML('beforeend', `<option value="${value}">${value}</option>`));

        const renderRows = () => {
          const filtered = snapshot.strategies.filter((s) => {
            if (statusSelect.value !== 'all' && s.status !== statusSelect.value) return false;
            const q = searchInput.value.trim().toLowerCase();
            if (q && !s.strategy_name.toLowerCase().includes(q)) return false;
            return true;
          });
          note.textContent = `${filtered.length} shown of ${snapshot.strategies.length} strategies · Phase A metrics are fill proxies, not live fills`;
          tbody.innerHTML = filtered.map((s) => `<tr><td><div class="strategy-name">${s.strategy_name}</div>${s.warnings?.length ? `<div class="muted">${s.warnings.join(' ')}</div>` : ''}</td><td><span class="${Dashboard.pillClass(s.status)}">${s.status}</span></td><td>${Dashboard.fmtNumber(s.open_exposure)} USDC</td><td>${Dashboard.fmtInt(s.open_positions)}</td><td>${Dashboard.fmtInt(s.recent_signals_count)}</td><td>${Dashboard.fmtInt(s.execution_checks_count_30d)}</td><td>${Dashboard.fmtNumber(s.avg_ev_after_slippage_10_pp_30d)} pp</td><td>${Dashboard.fmtNumber(s.avg_ev_after_slippage_50_pp_30d)} pp</td><td>${Dashboard.fmtNumber(s.avg_max_size_positive_ev_30d)} USD</td><td>${Dashboard.fmtNumber(s.realized_pnl_30d)} USDC</td><td>${Dashboard.fmtNumber(s.realized_pnl_all_time)} USDC</td></tr>`).join('');
        };

        statusSelect.addEventListener('change', renderRows);
        searchInput.addEventListener('input', renderRows);
        renderRows();
      }).catch((err) => {
        document.body.innerHTML = `<div class="shell"><div class="panel"><h1>Dashboard failed to load</h1><p>${err.message}</p></div></div>`;
      });
    </script>
  </body>
</html>

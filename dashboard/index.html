<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PPLayouts Dashboard · Overview</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">PPLayouts</p>
          <h1 id="page-title">Overview</h1>
          <p id="snapshot-meta" class="muted">Loading snapshot…</p>
        </div>
        <div class="status-cluster">
          <span id="snapshot-age" class="pill pill-neutral">…</span>
          <span id="run-status-pill" class="pill pill-neutral">run: …</span>
        </div>
      </header>

      <nav class="nav">
        <a href="./index.html" data-nav="overview">Overview</a>
        <a href="./strategies.html" data-nav="strategies">Strategies</a>
        <a href="./positions.html" data-nav="positions">Positions</a>
        <a href="./runs.html" data-nav="runs">Runs</a>
        <a href="./experiments.html" data-nav="experiments">Experiments</a>
        <a href="./wiki.html" data-nav="wiki">Wiki</a>
        <a href="./reference.html" data-nav="reference">Reference</a>
        <a href="./architecture.html" data-nav="architecture">Architecture</a>
      </nav>

      <section id="alerts-section" class="panel hidden section-gap">
        <div class="panel-header"><h2>Alerts</h2></div>
        <div id="alerts-list" class="stack"></div>
      </section>

      <section class="grid kpi-grid" id="overview-cards"></section>

      <section class="grid two-up section-gap" id="execution-mode-section"></section>

      <section class="grid two-up section-gap">
        <article class="panel">
          <div class="panel-header"><h2>Strategy factory</h2><span id="strategy-factory-meta" class="muted"></span></div>
          <div id="strategy-factory-panel" class="stack muted">No strategy-factory run record yet.</div>
        </article>
      </section>
    </div>
    <script src="./dashboard.js"></script>
    <script>
      Dashboard.renderNav('overview');
      Dashboard.loadSnapshot().then((snapshot) => {
        Dashboard.renderChrome(snapshot, 'Overview');
        Dashboard.renderAlerts(snapshot);

        const confluenceCount = snapshot.overview.confluence_boosted_24h || 0;
        const cards = [
          ['Active exposure', `${Dashboard.fmtNumber(snapshot.overview.open_exposure_active)} USDC`, `${Dashboard.fmtInt(snapshot.overview.open_position_count_active)} active open positions`],
          ['Legacy exposure', `${Dashboard.fmtNumber(snapshot.overview.open_exposure_legacy)} USDC`, `${Dashboard.fmtInt(snapshot.overview.open_position_count_legacy)} paused / legacy open positions`],
          ['Latest run', snapshot.overview.latest_run_status, Dashboard.fmtDate(snapshot.overview.latest_run_started_at)],
          ['Confluence', `${confluenceCount}`, 'trades boosted by 2+ strategy agreement'],
        ];
        document.getElementById('overview-cards').innerHTML = cards.map(([label, value, sub]) => `<article class="kpi-card"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-sub">${sub}</div></article>`).join('');

        // --- Execution mode tables ---
        const classified = Dashboard.classifyStrategies(snapshot.strategies);

        const twAbbr = (tw) => tw ? tw.replace('super_short', 'SS').replace('intraday', '1D').replace('short', 'S').replace('medium', 'M').replace('long', 'L') : '?';

        // Live table: real-money stats only
        const liveRows = classified.paper_and_live.map(s => {
          const live = (s.by_mode || {}).live || {};
          const pnl = live.realized_pnl_all_time || 0;
          return `<tr><td>${s.strategy_name}<div class="muted">${twAbbr(s.time_window)}</div></td><td>${Dashboard.fmtInt(live.open_positions)}</td><td>${Dashboard.fmtInt(live.closed_positions)}</td><td>${Dashboard.fmtNumber(live.open_exposure)} USDC</td><td class="${pnl > 0 ? 'positive' : pnl < 0 ? 'negative' : ''}">${Dashboard.fmtNumber(pnl)} USDC</td></tr>`;
        }).join('');

        // Paper trading: paper stats for ALL trading strategies (including live ones)
        const allPaper = [...classified.paper_and_live, ...classified.paper];
        const paperRows = allPaper.map(s => {
          const paper = (s.by_mode || {}).paper || {};
          const pnl = paper.realized_pnl_all_time || 0;
          const open = paper.open_positions || 0;
          const closed = paper.closed_positions || 0;
          const exposure = paper.open_exposure || 0;
          return `<tr><td>${s.strategy_name}<div class="muted">${twAbbr(s.time_window)}${s.live_ready ? ' · live' : ''}</div></td><td>${Dashboard.fmtInt(open)}</td><td>${Dashboard.fmtInt(closed)}</td><td>${Dashboard.fmtNumber(exposure)} USDC</td><td class="${pnl > 0 ? 'positive' : pnl < 0 ? 'negative' : ''}">${Dashboard.fmtNumber(pnl)} USDC</td><td>${Dashboard.fmtInt(s.recent_signals_count)}</td></tr>`;
        }).join('');

        const otherGroups = {
          'Alert (collecting signals)': classified.alert_active,
          'Alert (no signals)': classified.alert_dead,
        };
        const modeSection = document.getElementById('execution-mode-section');
        const livePanel = `<article class="panel"><div class="panel-header"><h2>Live</h2><span class="pill pill-live">${classified.paper_and_live.length}</span></div>${classified.paper_and_live.length ? `<div class="table-wrap"><table><thead><tr><th>Strategy</th><th>Open</th><th>Closed</th><th>Exposure</th><th>PnL (all)</th></tr></thead><tbody>${liveRows}</tbody></table></div>` : '<div class="muted">None</div>'}</article>`;
        const paperPanel = `<article class="panel"><div class="panel-header"><h2>Paper trading</h2><span class="pill pill-paper">${allPaper.length}</span></div><div class="table-wrap"><table><thead><tr><th>Strategy</th><th>Open</th><th>Closed</th><th>Exposure</th><th>PnL (all)</th><th>Signals (30d)</th></tr></thead><tbody>${paperRows}</tbody></table></div></article>`;
        const otherPanels = Object.entries(otherGroups).map(([label, items]) => {
          const pillCls = label.includes('collecting') ? 'pill-alert' : 'pill-neutral';
          const rows = items.map(s => {
            const pnl = s.realized_pnl_all_time || 0;
            const pnlCls = pnl > 0 ? 'positive' : pnl < 0 ? 'negative' : '';
            return `<tr><td>${s.strategy_name}<div class="muted">${twAbbr(s.time_window)}</div></td><td>${Dashboard.fmtInt(s.open_positions)}</td><td>${Dashboard.fmtNumber(s.open_exposure)} USDC</td><td class="${pnlCls}">${Dashboard.fmtNumber(pnl)} USDC</td><td>${Dashboard.fmtInt(s.recent_signals_count)}</td></tr>`;
          }).join('');
          return `<article class="panel"><div class="panel-header"><h2>${label}</h2><span class="pill ${pillCls}">${items.length}</span></div>${items.length ? `<div class="table-wrap"><table><thead><tr><th>Strategy</th><th>Open</th><th>Exposure</th><th>PnL (all)</th><th>Signals (30d)</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="muted">None</div>'}</article>`;
        }).join('');
        const pnlWarning = '<div class="alert" style="margin-top:12px;font-size:0.82rem">Paper PnL for NO-side trades before 2026-04-20 may be overstated due to a pricing bug (fixed).</div>';
        modeSection.innerHTML = livePanel + paperPanel + pnlWarning + otherPanels;

        // Strategy factory: simplified status indicator
        const strategyFactory = snapshot.overview.strategy_factory;
        const strategyFactoryPanel = document.getElementById('strategy-factory-panel');
        const strategyFactoryMeta = document.getElementById('strategy-factory-meta');
        if (strategyFactory) {
          const sfStatus = strategyFactory.status === 'failed' ? 'failed' : (strategyFactory.degraded ? 'degraded' : 'ok');
          const lastDate = strategyFactory.finished_at || strategyFactory.started_at;
          strategyFactoryMeta.textContent = Dashboard.fmtDate(lastDate);
          strategyFactoryPanel.classList.remove('muted');
          strategyFactoryPanel.innerHTML = `<div><span class="${Dashboard.pillClass(sfStatus)}">${sfStatus}</span> · last success ${Dashboard.fmtDate(lastDate)}</div>${strategyFactory.error ? `<div class="muted section-gap">${Dashboard.cleanSummary(strategyFactory.error)}</div>` : ''}`;
        }
      }).catch((err) => {
        document.body.innerHTML = `<div class="shell"><div class="panel"><h1>Dashboard failed to load</h1><p>${err.message}</p></div></div>`;
      });
    </script>
  </body>
</html>

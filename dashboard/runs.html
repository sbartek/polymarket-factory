<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PPLayouts Dashboard · Runs</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div><p class="eyebrow">PPLayouts</p><h1 id="page-title">Runs</h1><p id="snapshot-meta" class="muted">Loading snapshot…</p></div>
        <div class="status-cluster"><span id="snapshot-age" class="pill pill-neutral">…</span><span id="run-status-pill" class="pill pill-neutral">run: …</span></div>
      </header>
      <nav class="nav"><a href="./index.html" data-nav="overview">Overview</a><a href="./strategies.html" data-nav="strategies">Strategies</a><a href="./positions.html" data-nav="positions">Positions</a><a href="./runs.html" data-nav="runs">Runs</a><a href="./experiments.html" data-nav="experiments">Experiments</a><a href="./wiki.html" data-nav="wiki">Wiki</a></nav>
      <section id="alerts-section" class="panel hidden section-gap"><div class="panel-header"><h2>Alerts</h2></div><div id="alerts-list" class="stack"></div></section>
      <section class="list-grid" id="runs-list"></section>
    </div>
    <script src="./dashboard.js"></script>
    <script>
      Dashboard.renderNav('runs');
      Dashboard.loadSnapshot().then((snapshot) => {
        Dashboard.renderChrome(snapshot, 'Runs');
        Dashboard.renderAlerts(snapshot);
        document.getElementById('runs-list').innerHTML = snapshot.runs.map((r) => `<article class="run-card"><div class="panel-header"><div><h3>${Dashboard.fmtDate(r.started_at)}</h3><div class="muted code">${r.run_id}</div></div><span class="${Dashboard.pillClass(r.status)}">${r.status}</span></div><p>${r.summary}</p><div class="card-meta"><span class="pill pill-neutral">duration ${Dashboard.fmtDuration(r.duration_seconds)}</span><span class="pill pill-neutral">strategies ${Dashboard.fmtInt(r.strategies_checked)}</span><span class="pill pill-neutral">signals ${Dashboard.fmtInt(r.signals_generated)}</span><span class="pill pill-neutral">decisions ${Dashboard.fmtInt(r.decisions_logged)}</span></div></article>`).join('');
      }).catch((err) => {
        document.body.innerHTML = `<div class="shell"><div class="panel"><h1>Dashboard failed to load</h1><p>${err.message}</p></div></div>`;
      });
    </script>
  </body>
</html>

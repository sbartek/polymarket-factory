<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PPLayouts Dashboard · Experiments</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div><p class="eyebrow">PPLayouts</p><h1 id="page-title">Experiments</h1><p id="snapshot-meta" class="muted">Loading snapshot…</p></div>
        <div class="status-cluster"><span id="snapshot-age" class="pill pill-neutral">…</span><span id="run-status-pill" class="pill pill-neutral">run: …</span></div>
      </header>
      <nav class="nav"><a href="./index.html" data-nav="overview">Overview</a><a href="./strategies.html" data-nav="strategies">Strategies</a><a href="./positions.html" data-nav="positions">Positions</a><a href="./runs.html" data-nav="runs">Runs</a><a href="./experiments.html" data-nav="experiments">Experiments</a><a href="./wiki.html" data-nav="wiki">Wiki</a><a href="./reference.html" data-nav="reference">Reference</a>
        <a href="./architecture.html" data-nav="architecture">Architecture</a></nav>
      <section id="alerts-section" class="panel hidden section-gap"><div class="panel-header"><h2>Alerts</h2></div><div id="alerts-list" class="stack"></div></section>
      <section class="panel section-gap"><div class="panel-header"><h2>Current experiment threads</h2><span class="muted">Active and review_due</span></div><div class="controls"><label>Scope<select id="filter-scope"><option value="all">All</option></select></label><label>Search<input id="filter-search" type="text" placeholder="experiment title" /></label></div><div class="small-note" id="experiment-filter-note"></div><div id="current-experiments" class="list-grid"></div></section>
      <section class="panel"><div class="panel-header"><h2>Completed / background experiments</h2><span class="muted">System and portfolio context</span></div><div id="completed-experiments" class="list-grid"></div></section>
    </div>
    <script src="./dashboard.js"></script>
    <script>
      Dashboard.renderNav('experiments');
      Dashboard.loadSnapshot().then((snapshot) => {
        Dashboard.renderChrome(snapshot, 'Experiments');
        Dashboard.renderAlerts(snapshot);
        const current = snapshot.experiments.filter((e) => ['active', 'review_due'].includes(e.status));
        const completed = snapshot.experiments.filter((e) => !['active', 'review_due'].includes(e.status));
        const renderCard = (e) => `<article class="experiment-card"><div class="panel-header"><div><h3>${e.title}</h3><div class="muted code">${e.experiment_id}</div></div><span class="${Dashboard.pillClass(e.status)}">${e.status}</span></div><p>${Dashboard.cleanSummary(e.summary || e.hypothesis)}</p><div class="card-meta"><span class="pill pill-info">${e.scope_type}</span><span class="pill pill-neutral">${e.scope_label}</span>${e.strategy ? `<span class="pill pill-neutral">strategy ${e.strategy}</span>` : ''}</div></article>`;

        const scopeSelect = document.getElementById('filter-scope');
        const searchInput = document.getElementById('filter-search');
        const note = document.getElementById('experiment-filter-note');
        Dashboard.uniqueValues(current, 'scope_type').forEach((value) => scopeSelect.insertAdjacentHTML('beforeend', `<option value="${value}">${value}</option>`));

        const renderCurrent = () => {
          const filtered = current.filter((e) => {
            if (scopeSelect.value !== 'all' && e.scope_type !== scopeSelect.value) return false;
            const q = searchInput.value.trim().toLowerCase();
            if (q && !(`${e.title} ${e.scope_label} ${e.experiment_id}`.toLowerCase().includes(q))) return false;
            return true;
          });
          note.textContent = `${filtered.length} shown of ${current.length} current experiments`;
          document.getElementById('current-experiments').innerHTML = filtered.map(renderCard).join('') || '<div class="muted">No current experiments.</div>';
        };

        scopeSelect.addEventListener('change', renderCurrent);
        searchInput.addEventListener('input', renderCurrent);
        renderCurrent();
        document.getElementById('completed-experiments').innerHTML = completed.map(renderCard).join('') || '<div class="muted">No completed experiments.</div>';
      }).catch((err) => {
        document.body.innerHTML = `<div class="shell"><div class="panel"><h1>Dashboard failed to load</h1><p>${err.message}</p></div></div>`;
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PPLayouts Dashboard · Positions</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div><p class="eyebrow">PPLayouts</p><h1 id="page-title">Positions</h1><p id="snapshot-meta" class="muted">Loading snapshot…</p></div>
        <div class="status-cluster"><span id="snapshot-age" class="pill pill-neutral">…</span><span id="run-status-pill" class="pill pill-neutral">run: …</span></div>
      </header>
      <nav class="nav"><a href="./index.html" data-nav="overview">Overview</a><a href="./strategies.html" data-nav="strategies">Strategies</a><a href="./positions.html" data-nav="positions">Positions</a><a href="./runs.html" data-nav="runs">Runs</a><a href="./experiments.html" data-nav="experiments">Experiments</a></nav>
      <section id="alerts-section" class="panel hidden section-gap"><div class="panel-header"><h2>Alerts</h2></div><div id="alerts-list" class="stack"></div></section>
      <section class="grid kpi-grid" id="positions-kpis"></section>
      <section class="panel">
        <div class="panel-header"><h2>Open positions</h2><span id="positions-summary" class="muted"></span></div>
        <div class="controls">
          <label>Strategy status
            <select id="filter-status">
              <option value="all">All</option>
            </select>
          </label>
          <label>Strategy
            <select id="filter-strategy">
              <option value="all">All</option>
            </select>
          </label>
          <label>Time window
            <select id="filter-window">
              <option value="all">All</option>
            </select>
          </label>
          <label>Search
            <input id="filter-search" type="text" placeholder="market text" />
          </label>
        </div>
        <div class="small-note" id="positions-filter-note"></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Market</th><th>Strategy</th><th>Status</th><th>Side</th><th>Exposure</th><th>Window</th><th>Entered</th></tr></thead>
            <tbody id="positions-body"></tbody>
          </table>
        </div>
      </section>
    </div>
    <script src="./dashboard.js"></script>
    <script>
      Dashboard.renderNav('positions');
      Promise.all([
        Dashboard.loadSnapshot(),
        fetch(Dashboard.dataPath('positions-open')).then((r) => r.json()),
      ]).then(([snapshot, positions]) => {
        Dashboard.renderChrome(snapshot, 'Positions');
        Dashboard.renderAlerts(snapshot);

        const active = positions.filter((p) => p.strategy_status === 'active');
        const paused = positions.filter((p) => p.strategy_status === 'paused');
        const legacy = positions.filter((p) => p.strategy_status === 'legacy');
        const totalExposure = positions.reduce((sum, p) => sum + (p.exposure || 0), 0);
        const activeExposure = active.reduce((sum, p) => sum + (p.exposure || 0), 0);
        const pausedExposure = paused.reduce((sum, p) => sum + (p.exposure || 0), 0);

        const cards = [
          ['Open positions', Dashboard.fmtInt(positions.length), 'All currently open positions'],
          ['Active exposure', `${Dashboard.fmtNumber(activeExposure)} USDC`, `${Dashboard.fmtInt(active.length)} active positions`],
          ['Paused exposure', `${Dashboard.fmtNumber(pausedExposure)} USDC`, `${Dashboard.fmtInt(paused.length)} paused positions`],
          ['Total exposure', `${Dashboard.fmtNumber(totalExposure)} USDC`, `${Dashboard.fmtInt(legacy.length)} legacy positions`],
        ];
        document.getElementById('positions-kpis').innerHTML = cards.map(([label, value, sub]) => `<article class="kpi-card"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-sub">${sub}</div></article>`).join('');

        document.getElementById('positions-summary').textContent = `${active.length} active · ${paused.length} paused · ${legacy.length} legacy`;

        const statusSelect = document.getElementById('filter-status');
        const strategySelect = document.getElementById('filter-strategy');
        const windowSelect = document.getElementById('filter-window');
        const searchInput = document.getElementById('filter-search');
        const note = document.getElementById('positions-filter-note');
        const tbody = document.getElementById('positions-body');

        Dashboard.uniqueValues(positions, 'strategy_status').forEach((value) => statusSelect.insertAdjacentHTML('beforeend', `<option value="${value}">${value}</option>`));
        Dashboard.uniqueValues(positions, 'strategy').forEach((value) => strategySelect.insertAdjacentHTML('beforeend', `<option value="${value}">${value}</option>`));
        Dashboard.uniqueValues(positions, 'time_window').forEach((value) => windowSelect.insertAdjacentHTML('beforeend', `<option value="${value}">${value}</option>`));

        const renderRows = () => {
          const filtered = positions.filter((p) => {
            if (statusSelect.value !== 'all' && p.strategy_status !== statusSelect.value) return false;
            if (strategySelect.value !== 'all' && p.strategy !== strategySelect.value) return false;
            if (windowSelect.value !== 'all' && p.time_window !== windowSelect.value) return false;
            const q = searchInput.value.trim().toLowerCase();
            if (q && !(`${p.market} ${p.strategy} ${p.side}`.toLowerCase().includes(q))) return false;
            return true;
          });
          note.textContent = `${filtered.length} shown of ${positions.length} open positions`;
          tbody.innerHTML = filtered.map((p) => `<tr><td><div class="strategy-name">${p.market}</div>${p.url ? `<div class="muted code">${p.url}</div>` : ''}${p.warnings?.length ? `<div class="muted">${p.warnings.join(' ')}</div>` : ''}</td><td>${p.strategy}</td><td><span class="${Dashboard.pillClass(p.strategy_status)}">${p.strategy_status}</span></td><td>${p.side}</td><td>${Dashboard.fmtNumber(p.exposure)} USDC</td><td>${p.time_window}</td><td>${Dashboard.fmtDate(p.entry_time)}</td></tr>`).join('');
        };

        [statusSelect, strategySelect, windowSelect].forEach((el) => el.addEventListener('change', renderRows));
        searchInput.addEventListener('input', renderRows);
        renderRows();
      }).catch((err) => {
        document.body.innerHTML = `<div class="shell"><div class="panel"><h1>Dashboard failed to load</h1><p>${err.message}</p></div></div>`;
      });
    </script>
  </body>
</html>

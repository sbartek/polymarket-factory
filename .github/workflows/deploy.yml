name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-vm:
    name: Deploy to gpplayouts (GCP VM)
    runs-on: ubuntu-latest
    steps:
      - name: SSH and pull
        uses: appleboy/ssh-action@v1
        with:
          host: 136.111.128.20
          username: barteks
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/polymarket-factory
            git pull origin main
            if pgrep -f "uvicorn api.server:app --host 127.0.0.1 --port 8765" >/dev/null; then
              pkill -f "uvicorn api.server:app --host 127.0.0.1 --port 8765"
              sleep 2
            fi
            nohup ./run_api.sh > factory-api.log 2>&1 < /dev/null &

  deploy-mac:
    name: Deploy to pplayouts (Mac)
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: SSH and pull
        uses: appleboy/ssh-action@v1
        with:
          host: 100.102.142.55
          username: barteks
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/workai/projects/polymarket-factory
            git pull origin main

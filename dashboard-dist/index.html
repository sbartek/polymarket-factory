<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PPLayouts Dashboard · Overview</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">PPLayouts</p>
          <h1 id="page-title">Overview</h1>
          <p id="snapshot-meta" class="muted">Loading snapshot…</p>
        </div>
        <div class="status-cluster">
          <span id="snapshot-age" class="pill pill-neutral">…</span>
          <span id="run-status-pill" class="pill pill-neutral">run: …</span>
        </div>
      </header>

      <nav class="nav">
        <a href="./index.html" data-nav="overview">Overview</a>
        <a href="./strategies.html" data-nav="strategies">Strategies</a>
        <a href="./positions.html" data-nav="positions">Positions</a>
        <a href="./runs.html" data-nav="runs">Runs</a>
        <a href="./experiments.html" data-nav="experiments">Experiments</a>
      </nav>

      <section id="alerts-section" class="panel hidden section-gap">
        <div class="panel-header"><h2>Alerts</h2></div>
        <div id="alerts-list" class="stack"></div>
      </section>

      <section class="grid kpi-grid" id="overview-cards"></section>

      <section class="grid two-up">
        <article class="panel">
          <div class="panel-header"><h2>Strategy snapshot</h2><span id="strategy-summary" class="muted"></span></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Strategy</th><th>Status</th><th>Open exposure</th><th>Open positions</th><th>Recent decisions</th></tr></thead>
              <tbody id="strategies-body"></tbody>
            </table>
          </div>
        </article>

        <article class="panel">
          <div class="panel-header"><h2>Current experiments</h2><span id="experiment-summary" class="muted"></span></div>
          <div id="experiments-list" class="stack"></div>
        </article>
      </section>
    </div>
    <script src="./dashboard.js"></script>
    <script>
      Dashboard.renderNav('overview');
      Dashboard.loadSnapshot().then((snapshot) => {
        Dashboard.renderChrome(snapshot, 'Overview');
        Dashboard.renderAlerts(snapshot);

        const cards = [
          ['Active exposure', `${Dashboard.fmtNumber(snapshot.overview.open_exposure_active)} USDC`, `${Dashboard.fmtInt(snapshot.overview.open_position_count_active)} active open positions`],
          ['Legacy exposure', `${Dashboard.fmtNumber(snapshot.overview.open_exposure_legacy)} USDC`, `${Dashboard.fmtInt(snapshot.overview.open_position_count_legacy)} paused / legacy open positions`],
          ['Active strategies', Dashboard.fmtInt(snapshot.overview.active_strategy_count), 'Current active stack size'],
          ['Current experiments', Dashboard.fmtInt(snapshot.overview.active_experiment_count), 'Counts active + review_due threads'],
          ['Latest run duration', Dashboard.fmtDuration(snapshot.overview.latest_run_duration_seconds), Dashboard.fmtDate(snapshot.overview.latest_run_started_at)],
        ];
        document.getElementById('overview-cards').innerHTML = cards.map(([label, value, sub]) => `<article class="kpi-card"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-sub">${sub}</div></article>`).join('');

        const strategies = snapshot.strategies;
        document.getElementById('strategies-body').innerHTML = strategies.map((s) => `<tr><td><div class="strategy-name">${s.strategy_name}</div>${s.warnings?.length ? `<div class="muted">${s.warnings.join(' ')}</div>` : ''}</td><td><span class="${Dashboard.pillClass(s.status)}">${s.status}</span></td><td>${Dashboard.fmtNumber(s.open_exposure)} USDC</td><td>${Dashboard.fmtInt(s.open_positions)}</td><td>${Dashboard.fmtInt(s.recent_decisions_count)}</td></tr>`).join('');
        document.getElementById('strategy-summary').textContent = `${strategies.filter((s) => s.status === 'active').length} active · ${strategies.filter((s) => s.status === 'paused').length} paused`;

        const current = snapshot.experiments.filter((e) => ['active', 'review_due'].includes(e.status));
        document.getElementById('experiments-list').innerHTML = current.map((e) => `<article class="experiment-card"><div class="panel-header"><div><h3>${e.title}</h3><div class="muted code">${e.experiment_id}</div></div><span class="${Dashboard.pillClass(e.status)}">${e.status}</span></div><p>${Dashboard.cleanSummary(e.summary || e.hypothesis)}</p><div class="card-meta"><span class="pill pill-info">${e.scope_type}</span><span class="pill pill-neutral">${e.scope_label}</span></div></article>`).join('') || '<div class="muted">No current experiments.</div>';
        document.getElementById('experiment-summary').textContent = `${current.length} current threads`;
      }).catch((err) => {
        document.body.innerHTML = `<div class="shell"><div class="panel"><h1>Dashboard failed to load</h1><p>${err.message}</p></div></div>`;
      });
    </script>
  </body>
</html>
